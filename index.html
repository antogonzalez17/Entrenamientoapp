<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Athlete Performance</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0A0A0A;
    --bg-panel:#161616;
    --bg-panel-2:#1F1F1F;
    --bg-input:#141414;
    --chalk:#FFFFFF;
    --chalk-dim:#B3B3B3;
    --chalk-faint:#767676;
    --line:rgba(255,255,255,0.14);
    --line-strong:rgba(255,255,255,0.30);
    --yellow:#E2001A;
    --yellow-dim:rgba(226,0,26,0.16);
    --ember:#FF4D4D;
    --ember-dim:rgba(255,77,77,0.16);
    --sage:#FFFFFF;
    --sage-dim:rgba(255,255,255,0.14);
    --radius:3px;
    --font-display:'Space Grotesk',sans-serif;
    --font-body:'Inter',sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--chalk);
    font-family:var(--font-body);
    font-size:14px;
    line-height:1.5;
    min-height:100vh;
  }
  h1,h2,h3,h4{font-family:var(--font-display);font-weight:600;margin:0;letter-spacing:0.01em;}
  p{margin:0;}
  button{font-family:var(--font-body);cursor:pointer;}
  input,select,textarea{font-family:var(--font-body);}
  a{color:inherit;}
  ::selection{background:var(--yellow);color:#FFFFFF;}

  /* ---------- layout ---------- */
  #app{display:flex;min-height:100vh;}
  #sidebar{
    width:210px;flex:none;background:var(--bg-panel);
    border-right:1px solid var(--line);
    display:flex;flex-direction:column;
    padding:20px 0;
  }
  .brand{padding:0 20px 20px 20px;border-bottom:1px solid var(--line);margin-bottom:14px;}
  .brand-mark{width:38px;height:38px;border:2px solid var(--yellow);border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-weight:700;color:var(--chalk);background:var(--yellow);font-size:14px;margin-bottom:10px;letter-spacing:-0.03em;}
  .brand-logo{display:block;width:100%;max-width:130px;height:auto;margin:0 auto;}
  .brand span{display:block;font-size:11px;color:var(--chalk-dim);margin-top:6px;text-align:center;letter-spacing:0.08em;font-weight:600;}
  nav.side-nav{display:flex;flex-direction:column;gap:2px;padding:0 10px;}
  .nav-item{
    display:flex;align-items:center;gap:10px;
    padding:9px 10px;border-radius:var(--radius);
    color:var(--chalk-dim);font-size:13.5px;font-weight:500;
    border-left:2px solid transparent;
    transition:background .12s ease, color .12s ease;
  }
  .nav-item:hover{background:var(--bg-panel-2);color:var(--chalk);}
  .nav-item.active{background:var(--bg-panel-2);color:var(--chalk);border-left:2px solid var(--yellow);}
  .nav-dot{width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.55;flex:none;}

  #main-col{flex:1;min-width:0;display:flex;flex-direction:column;}
  #topbar{
    display:flex;align-items:center;justify-content:space-between;
    padding:14px 28px;border-bottom:1px solid var(--line);
    background:var(--bg);position:sticky;top:0;z-index:5;
    flex-wrap:wrap;gap:12px;
  }
  .role-switch{display:flex;background:var(--bg-panel);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;}
  .role-switch button{
    background:none;border:none;color:var(--chalk-dim);padding:7px 16px;font-size:13px;font-weight:600;
  }
  .role-switch button.active{background:var(--yellow);color:#FFFFFF;}
  .athlete-picker-inline select{min-width:180px;}
  #main{padding:26px 28px 60px 28px;flex:1;}

  /* ---------- typography helpers ---------- */
  .section-head{display:flex;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;gap:14px;margin-bottom:20px;}
  .section-head h2{font-size:22px;}
  .section-head .sub{color:var(--chalk-dim);font-size:13px;margin-top:4px;}
  .stat-num{font-family:var(--font-display);font-variant-numeric:tabular-nums;}

  /* ---------- buttons ---------- */
  .btn{
    display:inline-flex;align-items:center;gap:6px;
    border-radius:var(--radius);border:1px solid var(--line-strong);
    background:var(--bg-panel-2);color:var(--chalk);
    padding:8px 14px;font-size:13px;font-weight:600;
  }
  .btn:hover{border-color:var(--chalk-faint);}
  .btn-primary{background:var(--yellow);border-color:var(--yellow);color:#FFFFFF;}
  .btn-primary:hover{filter:brightness(1.06);}
  .btn-ghost{background:none;border-color:transparent;color:var(--chalk-dim);padding:8px 10px;}
  .btn-ghost:hover{color:var(--chalk);}
  .btn-danger{background:none;border-color:var(--ember);color:var(--ember);}
  .btn-sm{padding:5px 10px;font-size:12px;}
  .btn:disabled{opacity:.4;cursor:default;}

  /* ---------- cards ---------- */
  .card{
    position:relative;background:var(--bg-panel);border:1px solid var(--line);
    border-radius:var(--radius);padding:16px 18px;
  }
  .card-tab{position:absolute;top:0;left:0;width:5px;height:22px;border-radius:0 0 2px 0;}
  .tab-yellow{background:var(--yellow);}
  .tab-ember{background:var(--ember);}
  .tab-sage{background:var(--sage);}
  .grid{display:grid;gap:14px;}
  .grid-3{grid-template-columns:repeat(3,1fr);}
  .grid-2{grid-template-columns:repeat(2,1fr);}
  @media(max-width:900px){.grid-3{grid-template-columns:repeat(2,1fr);}}
  @media(max-width:640px){.grid-3,.grid-2{grid-template-columns:1fr;}}

  /* ---------- forms ---------- */
  label{display:block;font-size:12px;color:var(--chalk-dim);margin-bottom:5px;font-weight:500;}
  .field{margin-bottom:13px;}
  input[type=text],input[type=email],input[type=date],input[type=number],select,textarea{
    width:100%;background:var(--bg-input);border:1px solid var(--line-strong);
    color:var(--chalk);border-radius:var(--radius);padding:8px 10px;font-size:13.5px;
  }
  textarea{resize:vertical;min-height:60px;}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--yellow);}
  .row{display:flex;gap:10px;}
  .row > *{flex:1;}
  fieldset{border:1px solid var(--line);border-radius:var(--radius);padding:12px;margin:0 0 12px 0;}
  legend{padding:0 6px;font-size:12px;color:var(--chalk-dim);}
  .check-list{display:flex;flex-direction:column;gap:6px;max-height:160px;overflow:auto;padding:2px;}
  .check-row{display:flex;align-items:center;gap:8px;font-size:13px;}

  /* ---------- table ---------- */
  table{width:100%;border-collapse:collapse;}
  th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);font-size:13px;}
  th{color:var(--chalk-dim);font-weight:600;font-size:11.5px;text-transform:none;}
  td.num{font-variant-numeric:tabular-nums;}

  /* ---------- chips / badges ---------- */
  .badge{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:20px;font-size:11.5px;font-weight:600;}
  .badge-pending{background:var(--yellow-dim);color:var(--yellow);}
  .badge-done{background:var(--sage-dim);color:var(--sage);}
  .badge-type{background:var(--bg-panel-2);color:var(--chalk-dim);border:1px solid var(--line);}

  /* ---------- empty state ---------- */
  .empty{border:1px dashed var(--line-strong);border-radius:var(--radius);padding:34px 20px;text-align:center;color:var(--chalk-dim);}
  .empty h3{color:var(--chalk);font-size:15px;margin-bottom:6px;}
  .empty p{font-size:13px;margin-bottom:14px;}

  /* ---------- list rows (athletes, exercises...) ---------- */
  .list-row{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border:1px solid var(--line);border-radius:var(--radius);background:var(--bg-panel);margin-bottom:8px;gap:12px;flex-wrap:wrap;}
  .list-row .meta{color:var(--chalk-dim);font-size:12.5px;}
  .list-row .actions{display:flex;gap:6px;}

  /* ---------- modal ---------- */
  .modal-backdrop{position:fixed;inset:0;background:rgba(10,14,11,0.6);display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;overflow:auto;z-index:50;}
  .modal{background:var(--bg-panel);border:1px solid var(--line-strong);border-radius:var(--radius);width:100%;max-width:560px;padding:22px 24px;}
  .modal h3{font-size:16px;margin-bottom:16px;}
  .modal-close{float:right;background:none;border:none;color:var(--chalk-dim);font-size:18px;line-height:1;}
  .modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px;padding-top:14px;border-top:1px solid var(--line);}

  /* ---------- gauge ---------- */
  .gauge-wrap{display:flex;align-items:center;gap:16px;}
  .gauge-num{font-family:var(--font-display);font-size:26px;}
  .gauge-label{font-size:12px;color:var(--chalk-dim);}

  /* ---------- week board ---------- */
  .week-nav{display:flex;align-items:center;gap:10px;margin-bottom:16px;}
  .week-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:10px;}
  @media(max-width:900px){.week-grid{grid-template-columns:repeat(2,1fr);}}
  .day-col{border:1px solid var(--line);border-radius:var(--radius);background:var(--bg-panel);min-height:120px;padding:10px;}
  .day-head{font-size:11.5px;color:var(--chalk-dim);margin-bottom:8px;text-transform:capitalize;}
  .day-head.today{color:var(--yellow);}
  .day-item{background:var(--bg-panel-2);border:1px solid var(--line);border-radius:var(--radius);padding:7px 8px;margin-bottom:6px;font-size:12px;cursor:pointer;}
  .day-item:hover{border-color:var(--chalk-faint);}
  .day-item .t{font-weight:600;display:block;margin-bottom:2px;}
  .day-item.is-q{border-left:3px solid var(--chalk-dim);}
  .day-item-row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;}
  .item-actions{display:flex;gap:6px;flex-wrap:wrap;}
  /* Carpetas */
  .folder-bar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px;}
  .folder-chip{border:1px solid var(--line-strong);background:var(--bg-panel);color:var(--chalk);padding:7px 12px;border-radius:var(--radius);font-size:13px;cursor:pointer;}
  .folder-chip span{color:var(--chalk-faint);font-size:11.5px;margin-left:4px;}
  .folder-chip.selected{border-color:var(--yellow);background:var(--yellow-dim);}
  .folder-chip.selected span{color:var(--chalk-dim);}
  .folder-chip.folder-new{border-style:dashed;color:var(--chalk-dim);}
  .folder-actions{display:flex;align-items:center;gap:8px;margin-bottom:14px;flex-wrap:wrap;}
  .tag-filter-head{display:flex;align-items:center;gap:10px;margin-bottom:8px;flex-wrap:wrap;}
  .tag-count{opacity:.7;font-size:11px;margin-left:2px;}
  .day-item:not(.is-q){border-left:3px solid var(--yellow);}
  .day-col.is-today{border-color:var(--yellow);}
  .day-head-row{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-bottom:8px;}
  .day-head-row .day-head{margin-bottom:0;}
  .day-add{width:24px;height:24px;flex:none;border-radius:50%;border:1px solid var(--line-strong);background:transparent;color:var(--chalk);font-size:15px;line-height:1;cursor:pointer;}
  .day-add:hover{background:var(--yellow);border-color:var(--yellow);}
  /* Planificación: barra de vista y navegación */
  .cal-toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px;}
  .cal-nav{display:flex;align-items:center;gap:8px;}
  .cal-title{font-family:var(--font-display);font-weight:700;font-size:16px;margin-left:6px;text-transform:capitalize;}
  .seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:var(--radius);overflow:hidden;}
  .seg-btn{background:transparent;border:none;color:var(--chalk-dim);padding:7px 14px;font-size:13px;cursor:pointer;}
  .seg-btn.active{background:var(--yellow);color:#FFFFFF;font-weight:600;}
  /* Planificación: vista mensual */
  .month-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-top:1px solid var(--line);border-left:1px solid var(--line);}
  .month-dow{font-size:11.5px;color:var(--chalk-dim);text-align:center;padding:8px 0;border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--bg-panel);}
  .month-cell{min-height:104px;padding:6px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--bg-panel);cursor:pointer;min-width:0;}
  .month-cell:hover{background:var(--bg-panel-2);}
  .month-cell.out{background:var(--bg);}
  .month-cell.out .month-num{color:var(--chalk-faint);}
  .month-cell.is-today{box-shadow:inset 0 0 0 2px var(--yellow);}
  .month-num{font-size:13px;width:24px;height:24px;display:flex;align-items:center;justify-content:center;border-radius:50%;margin-bottom:4px;font-variant-numeric:tabular-nums;}
  .month-cell.is-today .month-num{background:var(--yellow);color:#FFFFFF;font-weight:700;}
  .month-chip{font-size:11px;line-height:1.3;padding:2px 5px;margin-bottom:3px;border-radius:2px;background:var(--bg-panel-2);border-left:3px solid var(--yellow);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .month-chip.is-q{border-left-color:var(--chalk-dim);}
  .month-chip.done{opacity:.55;}
  .month-more{font-size:10.5px;color:var(--chalk-dim);}
  @media(max-width:760px){
    .month-cell{min-height:64px;padding:3px;}
    .month-chip{font-size:0;height:5px;padding:0;margin-bottom:2px;pointer-events:none;}
    .month-more{font-size:9.5px;}
  }

  /* block editor */
  .video-link{color:var(--yellow);font-weight:600;font-size:12.5px;text-decoration:none;white-space:nowrap;}
  .video-link:hover{text-decoration:underline;}
  button.video-link{background:none;border:none;padding:0;cursor:pointer;font-family:var(--font-body);}
  .video-player-wrap{margin-top:16px;border-top:1px solid var(--line);padding-top:14px;}
  .video-player-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
  .video-frame{position:relative;padding-top:56.25%;height:0;overflow:hidden;border-radius:var(--radius);border:1px solid var(--line);background:#000;}
  .video-frame iframe{position:absolute;top:0;left:0;width:100%;height:100%;border:0;}

  /* ---------- exercise search & tags ---------- */
  .tag-grid{display:flex;flex-wrap:wrap;gap:6px;}
  .tag-chip{border:1px solid var(--line-strong);background:var(--bg-input);color:var(--chalk-dim);padding:5px 10px;border-radius:20px;font-size:12px;}
  .tag-chip.selected{background:var(--yellow-dim);border-color:var(--yellow);color:var(--yellow);font-weight:600;}
  .ex-thumb{width:34px;height:34px;border-radius:2px;object-fit:cover;flex:none;background:var(--bg-input);}
  .ex-thumb-placeholder{width:34px;height:34px;border-radius:2px;flex:none;background:var(--bg-input);display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--chalk-faint);}
  .ex-search-wrap{position:relative;}
  .ex-dropdown{position:absolute;top:100%;left:0;right:0;background:var(--bg-panel);border:1px solid var(--line-strong);border-radius:var(--radius);max-height:220px;overflow:auto;z-index:20;margin-top:2px;}
  .ex-dropdown-item{display:flex;gap:8px;align-items:center;padding:7px 9px;cursor:pointer;border-bottom:1px solid var(--line);}
  .ex-dropdown-item:last-child{border-bottom:none;}
  .ex-dropdown-item:hover{background:var(--bg-panel-2);}
  .ex-dd-name{font-size:12.5px;font-weight:600;}
  .ex-dd-tags{font-size:10.5px;color:var(--chalk-dim);margin-top:2px;}

  /* ---------- nested session block editor ---------- */
  .block-editor{border:1px solid var(--line);border-radius:var(--radius);padding:12px;margin-bottom:14px;background:var(--bg-panel-2);}
  .block-editor-head{display:flex;gap:8px;margin-bottom:10px;}
  .block-editor-head input{flex:1;font-weight:600;}
  .ex-row{display:grid;grid-template-columns:1.3fr .55fr .55fr .7fr .7fr 1fr 1fr auto;gap:6px;align-items:start;margin-bottom:6px;}
  @media(max-width:760px){.ex-row{grid-template-columns:1fr 1fr;}}
  .ex-row input, .ex-row select{padding:6px 8px;font-size:12.5px;}
  .ss-head select{width:auto;padding:5px 8px;font-size:12.5px;}
  .ex-row input:disabled{opacity:.7;cursor:not-allowed;}
  .ex-row-actions{display:flex;gap:2px;}
  .ex-select{width:20px;height:20px;flex:none;margin:0 8px 0 0;accent-color:var(--yellow);cursor:pointer;}
  .ex-row.is-selected .ex-search-input{border-color:var(--yellow);}
  .sel-wrap{margin:4px 0 10px 0;}
  .sel-hint{font-size:11.5px;color:var(--chalk-faint);margin:0;}
  .sel-bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:8px 10px;border:1px solid var(--yellow);border-radius:var(--radius);background:var(--yellow-dim);font-size:12.5px;}
  @media(max-width:760px){
    .ex-select{width:24px;height:24px;}
    .ex-search-wrap{grid-column:1 / -1;}
    .sel-bar{position:sticky;bottom:8px;z-index:5;}
    .sel-bar .btn{padding:9px 12px;}
  }
  .modal:has(#blocksContainer){max-width:1080px;width:calc(100% - 32px);}
  .ss-box{border:1px solid var(--yellow);border-left:4px solid var(--yellow);border-radius:var(--radius);padding:10px;margin-bottom:10px;background:rgba(226,0,26,0.06);}
  .ss-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:8px;font-size:12.5px;}
  .ss-head strong{color:var(--yellow);font-size:13px;}
  .ss-head label{display:flex;align-items:center;gap:6px;margin:0;color:var(--chalk-dim);font-size:12px;}
  .ss-head input{width:90px;padding:5px 8px;font-size:12.5px;}
  .ss-head input.ss-rounds{width:64px;}
  .ss-tag{display:inline-block;background:var(--yellow);color:#FFFFFF;font-weight:700;font-size:10.5px;padding:1px 5px;border-radius:2px;margin-right:6px;vertical-align:middle;}
  .ex-search-wrap{display:flex;align-items:center;}
  .ex-search-wrap .ex-search-input{flex:1;min-width:0;}
  tr.ss-view-row td{color:var(--yellow);font-weight:600;font-size:12px;padding-top:10px;}
  tr.ss-member td:first-child{border-left:3px solid var(--yellow);}

  .toast{position:fixed;bottom:20px;right:20px;background:var(--bg-panel-2);border:1px solid var(--line-strong);padding:10px 16px;border-radius:var(--radius);font-size:13px;z-index:100;box-shadow:none;}
  .scale-opts{display:flex;gap:6px;flex-wrap:wrap;}
  .scale-opt{border:1px solid var(--line-strong);background:var(--bg-input);color:var(--chalk-dim);padding:7px 12px;border-radius:var(--radius);font-size:13px;font-variant-numeric:tabular-nums;}
  .scale-opt.selected{background:var(--yellow);border-color:var(--yellow);color:#FFFFFF;font-weight:700;}
  .sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);}

  @media(max-width:760px){
    #app{flex-direction:column;}
    #sidebar{width:100%;flex-direction:row;overflow-x:auto;padding:12px;}
    .brand{flex:none;padding:0 10px 0 0;margin:0;border:none;display:flex;align-items:center;}
    .brand .brand-logo{width:38px;}
    .brand span{display:none;}
    nav.side-nav{flex-direction:row;padding:0;}
    #main{padding:18px 16px 60px 16px;}
  }
</style>
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <div class="brand">
      <img class="brand-logo" src="" alt="AG Athlete Performance">
      <span>ELEVA TU RENDIMIENTO</span>
    </div>
    <nav class="side-nav" id="sideNav"></nav>
  </aside>
  <div id="main-col">
    <div id="topbar"></div>
    <main id="main"></main>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
/* ==================== SUPABASE (BASE DE DATOS PROPIA) ==================== */
const SUPABASE_URL = 'https://evmxurlyefwmihfyxgrj.supabase.co';
const SUPABASE_KEY = 'sb_publishable_6gH5qHTYFqiWSrwDFm5Hyg_kDxVOkjA';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const APP_SHELL = document.getElementById('app').innerHTML;
const APP_URL = location.origin + location.pathname;

/* ==================== STORAGE HELPERS ==================== */
// La biblioteca de un entrenador (ejercicios, plantillas de sesión y de
// cuestionario) vive en la tabla app_data, separada por coach_id.
// Lo asignado a cada deportista va aparte, en athlete_items (ver más abajo).
async function loadKey(key, fallback){
  try{
    const { data, error } = await sb.from('app_data').select('value').eq('coach_id', view.coachId).eq('key', key).maybeSingle();
    if(error){ console.error(error); return fallback; }
    return data ? data.value : fallback;
  }catch(e){ console.error(e); return fallback; }
}
async function saveKey(key, value, silent){
  try{
    const { error } = await sb.from('app_data').upsert({ coach_id: view.coachId, key, value }, { onConflict: 'coach_id,key' });
    if(error){ if(!silent) toast('No se pudo guardar. Revisa tu conexión.'); console.error(error); return null; }
    return true;
  }catch(e){ if(!silent) toast('Error al guardar.'); console.error(e); return null; }
}
// Cada sesión o cuestionario asignado es una fila propia en la tabla
// athlete_items. Así Supabase solo deja a cada deportista leer y modificar
// lo suyo, y dos guardados a la vez ya no se pisan entre sí.
async function loadItems(){
  const out = { session:[], questionnaire:[] };
  const col = view.role==='coach' ? 'coach_id' : 'athlete_id';
  const val = view.role==='coach' ? view.coachId : view.athleteId;
  const PAGE = 1000; // Supabase devuelve como máximo 1000 filas por consulta
  try{
    for(let from=0; ; from+=PAGE){
      const { data, error } = await sb.from('athlete_items').select('kind,data').eq(col, val).order('id').range(from, from+PAGE-1);
      if(error){ console.error(error); toast('No se pudieron cargar las sesiones asignadas.'); break; }
      data.forEach(r=>{ if(out[r.kind]) out[r.kind].push(r.data); });
      if(data.length < PAGE) break;
    }
  }catch(e){ console.error(e); toast('No se pudieron cargar las sesiones asignadas.'); }
  return out;
}
async function insertItems(kind, items){
  const rows = items.map(a=>({ id:a.id, coach_id:view.coachId, athlete_id:a.athleteId, kind, data:a }));
  try{
    const { error } = await sb.from('athlete_items').insert(rows);
    if(error){ console.error(error); return false; }
    return true;
  }catch(e){ console.error(e); return false; }
}
async function updateItem(a){
  try{
    const { data, error } = await sb.from('athlete_items').update({ data:a, updated_at:new Date().toISOString() }).eq('id', a.id).select('id');
    // Si no vuelve ninguna fila es que no se ha guardado (sin permiso o no existe)
    if(error || !data || !data.length){ console.error(error || 'athlete_items: fila no actualizada'); return false; }
    return true;
  }catch(e){ console.error(e); return false; }
}
async function deleteItem(id){
  try{
    const { data, error } = await sb.from('athlete_items').delete().eq('id', id).select('id');
    if(error || !data || !data.length){ console.error(error || 'athlete_items: fila no borrada'); return false; }
    return true;
  }catch(e){ console.error(e); return false; }
}
async function loadAthletes(){
  try{
    const { data, error } = await sb.from('profiles').select('*').eq('role','athlete').eq('coach_id', view.coachId).order('name');
    if(error){ console.error(error); return []; }
    return data || [];
  }catch(e){ console.error(e); return []; }
}

function migrateBlocks(blocks){
  if(!blocks || !blocks.length) return [];
  if(blocks[0] && Array.isArray(blocks[0].exercises)) return blocks;
  return [{id:uid('blk'), name:'Bloque 1', exercises: blocks.map(b=>({
    id: b.id || uid('exx'), exerciseName:b.exerciseName||'', sets:b.sets||'', reps:b.reps||'',
    load:b.load||'', rest:b.rest||'', videoUrl:b.videoUrl||'', notes:b.notes||'', done: b.done||false
  }))}];
}

/* ==================== SUPERSERIES ==================== */
// Dentro de un bloque, los ejercicios siguen en una lista plana (blk.exercises).
// Una superserie es {id, rounds, rest} en blk.supersets y cada ejercicio que la
// forma lleva supersetId. Las series de esos ejercicios = rondas de la superserie.
function normalizeSupersets(blk){
  blk.exercises = blk.exercises || [];
  const used = new Set(blk.exercises.map(e=>e.supersetId).filter(Boolean));
  blk.supersets = (blk.supersets||[]).filter(ss=>used.has(ss.id));
  const valid = new Set(blk.supersets.map(ss=>ss.id));
  blk.exercises.forEach(e=>{ if(e.supersetId && !valid.has(e.supersetId)) leaveSuperset(e); });
  // Una superserie de un solo ejercicio deja de serlo
  blk.supersets = blk.supersets.filter(ss=>{
    const members = blk.exercises.filter(e=>e.supersetId===ss.id);
    if(members.length<2){ members.forEach(leaveSuperset); return false; }
    return true;
  });
  // Los ejercicios de una superserie van seguidos, en el orden en que aparecen
  const ordered = [];
  blk.exercises.forEach(e=>{
    if(ordered.includes(e)) return;
    if(e.supersetId) blk.exercises.filter(x=>x.supersetId===e.supersetId).forEach(x=>ordered.push(x));
    else ordered.push(e);
  });
  blk.exercises = ordered;
  // Series = rondas, salvo en los ejercicios a los que se les ha cambiado a mano (setsCustom)
  blk.supersets.forEach(ss=>blk.exercises.filter(e=>e.supersetId===ss.id && !e.setsCustom).forEach(e=>{ e.sets = ss.rounds==null ? '' : String(ss.rounds); }));
  return blk;
}
// Opciones del desplegable de descanso
const REST_OPTIONS = ['0s','10s','15s','20s','25s','30s','35s','40s','45s','50s','55s','60s','90s','2min','3min','4min','5min','6min'];
function restSelectHtml(value, attrs){
  const v = (value||'').trim();
  // Si había un descanso escrito a mano que no está en la lista, se conserva como opción
  const extra = v && !REST_OPTIONS.includes(v) ? `<option value="${esc(v)}" selected>${esc(v)}</option>` : '';
  return `<select ${attrs}><option value="">descanso</option>${extra}${REST_OPTIONS.map(o=>`<option value="${o}" ${o===v?'selected':''}>${o}</option>`).join('')}</select>`;
}
// Entrar / salir de una superserie: al salir recupera las series que tenía antes
function joinSuperset(e, ssId){ if(!e.supersetId && e.prevSets===undefined) e.prevSets = e.sets; e.supersetId = ssId; delete e.setsCustom; }
function leaveSuperset(e){ delete e.supersetId; delete e.setsCustom; if(e.prevSets!==undefined){ e.sets = e.prevSets; delete e.prevSets; } }
// Devuelve los ejercicios del bloque en tramos: {single: ex} o {ss, letter, exs:[...]}
function blockSegments(blk){
  const segs = []; let n = 0;
  (blk.exercises||[]).forEach(e=>{
    const ss = e.supersetId && (blk.supersets||[]).find(x=>x.id===e.supersetId);
    if(!ss){ segs.push({single:e}); return; }
    const last = segs[segs.length-1];
    if(last && last.ss===ss) last.exs.push(e);
    else segs.push({ss, letter:String.fromCharCode(65+(n++)), exs:[e]});
  });
  return segs;
}

async function loadAll(){
  const [exercises, sessionTemplates, qTemplates, items, athletes, exerciseFolders, sessionFolders] = await Promise.all([
    loadKey('exercises', []),
    loadKey('session-templates', []),
    loadKey('questionnaire-templates', defaultQuestionnaires()),
    loadItems(),
    loadAthletes(),
    view.role==='coach' ? loadKey('exercise-folders', []) : [],
    view.role==='coach' ? loadKey('session-folders', []) : []
  ]);
  const assignments = items.session, qAssignments = items.questionnaire;
  const migratedExercises = exercises.map(e=>({...e, categories: Array.isArray(e.categories) ? e.categories : (e.category ? [e.category] : [])}));
  const migratedSessionTemplates = sessionTemplates.map(s=>({...s, blocks: migrateBlocks(s.blocks)}));
  const migratedAssignments = assignments.map(a=>({...a, blocks: migrateBlocks(a.blocks)}));

  loaded = true;
}

async function doLogin(){
  const email = document.getElementById('a_email').value.trim();
  const pass = document.getElementById('a_pass').value;
  if(!email || !pass){ toast('Rellena email y contraseña.'); return; }
  const { error } = await sb.auth.signInWithPassword({email, password: pass});
  if(error){ toast('No se pudo iniciar sesión: '+error.message); return; }
  await afterAuth();
}
async function doSignup(role, coachId){
  const name = document.getElementById('a_name').value.trim();
  const email = document.getElementById('a_email').value.trim();
  const pass = document.getElementById('a_pass').value;
  if(!name || !email || !pass){ toast('Rellena todos los campos.'); return; }
  if(pass.length < 6){ toast('La contraseña debe tener al menos 6 caracteres.'); return; }
  const { data, error } = await sb.auth.signUp({email, password: pass});
  if(error){ toast('No se pudo crear la cuenta: '+error.message); return; }
  if(!data.session){
    toast('Revisa tu email para confirmar la cuenta antes de entrar.');
    return;
  }
  const profileRow = { id: data.user.id, role, coach_id: role==='coach' ? null : coachId, name, email };
  const { error: pErr } = await sb.from('profiles').insert(profileRow);
  if(pErr){ toast('Cuenta creada pero hubo un error al configurar el perfil: '+pErr.message); return; }
  await afterAuth();
}
async function afterAuth(){
  const { data: { session } } = await sb.auth.getSession();
  if(!session){ authMode='login'; renderAuthScreen(); return; }
  const { data: profile, error } = await sb.from('profiles').select('*').eq('id', session.user.id).maybeSingle();
  if(error || !profile){
    toast('No se pudo cargar tu perfil.');
    await sb.auth.signOut();
    authMode='login'; renderAuthScreen(); return;
  }
  view.role = profile.role;
  view.coachId = profile.role==='coach' ? profile.id : profile.coach_id;
  view.athleteId = profile.role==='athlete' ? profile.id : null;
  view.section = profile.role==='coach' ? 'panel' : 'week';
  view.myName = profile.name;
  await startApp();
}

function esc(s){ return (s||'').toString().replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmtDate(iso){
  const d = new Date(iso+'T00:00:00');
  return d.toLocaleDateString('es-ES', {weekday:'short', day:'2-digit', month:'short'});
}
// Fechas siempre en hora local de España (no UTC), para que la semana
// empiece en lunes y "hoy" sea el día real
function localISO(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function todayISO(){ return localISO(new Date()); }
function addDays(iso, n){ const d = new Date(iso+'T00:00:00'); d.setDate(d.getDate()+n); return localISO(d); }
function startOfWeek(iso){
  const d = new Date(iso+'T00:00:00');
  const day = (d.getDay()+6)%7; // Monday=0
  d.setDate(d.getDate()-day);
  return localISO(d);
}
function athleteName(id){ const a = state.athletes.find(x=>x.id===id); return a? a.name : '—'; }
function normalizeUrl(u){
  if(!u) return '';
  const t = u.trim();
  if(!t) return '';
  return /^https?:\/\//i.test(t) ? t : 'https://'+t;
}
function youTubeId(url){
  const u = normalizeUrl(url); if(!u) return null;
  try{
    const parsed = new URL(u);
    const host = parsed.hostname.replace(/^www\.|^m\./,'');
    if(host==='youtube.com'){
      let id = parsed.searchParams.get('v');
      if(!id && parsed.pathname.startsWith('/shorts/')) id = parsed.pathname.split('/')[2];
      if(!id && parsed.pathname.startsWith('/embed/')) id = parsed.pathname.split('/')[2];
      return id || null;
    }
    if(host==='youtu.be'){ return parsed.pathname.slice(1).split('/')[0] || null; }
  }catch(e){ return null; }
  return null;
}
function vimeoId(url){
  const u = normalizeUrl(url); if(!u) return null;
  try{
    const parsed = new URL(u);
    const host = parsed.hostname.replace(/^www\.|^m\./,'');
    if(host==='vimeo.com'){
      const id = parsed.pathname.split('/').filter(Boolean)[0];
      return id && /^\d+$/.test(id) ? id : null;
    }
  }catch(e){ return null; }
  return null;
}
function embedSrc(url){
  const yid = youTubeId(url);
  if(yid) return `https://www.youtube.com/embed/${yid}`;
  const vid = vimeoId(url);
  if(vid) return `https://player.vimeo.com/video/${vid}`;
  return null;
}
function thumbUrl(exOrUrl){
  const url = typeof exOrUrl==='string' ? exOrUrl : exOrUrl.videoUrl;
  const yid = youTubeId(url);
  return yid ? `https://img.youtube.com/vi/${yid}/mqdefault.jpg` : null;
}
function showVideoPlayer(container, url, title){

/* ==================== COACH: PANEL ==================== */
function renderCoachPanel(main){
  const week0 = startOfWeek(todayISO());
  const week1 = addDays(week0,7);
  const sessionsWeek = state.assignments.filter(a=> a.date>=week0 && a.date<week1);
  const pending = sessionsWeek.filter(a=>a.status==='pendiente').length;
  const done = sessionsWeek.filter(a=>a.status==='completada').length;

  const last7 = addDays(todayISO(),-7);
  const wellnessResp = [];
  const rpeResp = [];
  state.qAssignments.filter(qa=>qa.status==='completada' && qa.date>=last7).forEach(qa=>{
    qa.questions.forEach(q=>{
      if(q.type==='escala'){
        const v = qa.responses[q.id];
        if(v!=null && v!==''){
          if(qa.type==='wellness') wellnessResp.push(Number(v)/q.max*100);
          if(qa.type==='rpe') rpeResp.push(Number(v));
        }
      }
    });
  });
  const wellnessAvg = wellnessResp.length? Math.round(wellnessResp.reduce((a,b)=>a+b,0)/wellnessResp.length) : null;
  const rpeAvg = rpeResp.length? (rpeResp.reduce((a,b)=>a+b,0)/rpeResp.length).toFixed(1) : null;

  const recentFeedback = state.assignments.filter(a=>a.status==='completada' && a.athleteNotes)
    .sort((a,b)=> (b.completedAt||'').localeCompare(a.completedAt||'')).slice(0,5);

  main.innerHTML = `
    <div class="section-head">
      <div><h2>Panel</h2><div class="sub">Resumen de esta semana</div></div>
    </div>
    <div class="grid grid-3" style="margin-bottom:20px;">
      <div class="card"><div class="card-tab tab-yellow"></div>
        <div class="gauge-label">Deportistas activos</div>
        <div class="stat-num" style="font-size:28px;margin-top:4px;">${state.athletes.length}</div>
      </div>
      <div class="card"><div class="card-tab tab-sage"></div>
        <div class="gauge-label">Sesiones completadas (semana)</div>
        <div class="stat-num" style="font-size:28px;margin-top:4px;">${done}</div>
      </div>
      <div class="card"><div class="card-tab tab-ember"></div>
        <div class="gauge-label">Sesiones pendientes (semana)</div>
        <div class="stat-num" style="font-size:28px;margin-top:4px;">${pending}</div>
      </div>
    </div>
    <div class="grid grid-2" style="margin-bottom:20px;align-items:stretch;">
      <div class="card">
        <div class="gauge-label" style="margin-bottom:10px;">Wellness medio (últimos 7 días)</div>
        ${wellnessAvg==null ? emptyInline('Aún sin respuestas de wellness.') : gaugeSVG(wellnessAvg,100,'/100','var(--sage)')}
      </div>
      <div class="card">
        <div class="gauge-label" style="margin-bottom:10px;">RPE medio de sesión (últimos 7 días)</div>
        ${rpeAvg==null ? emptyInline('Aún sin respuestas de RPE.') : gaugeSVG(Math.round(rpeAvg/10*100),100,rpeAvg+'/10','var(--ember)')}
      </div>
    </div>
    <h3 style="font-size:15px;margin-bottom:10px;">Comentarios recientes de deportistas</h3>
    <div id="recentFeedback"></div>
  `;
  const fbEl = main.querySelector('#recentFeedback');
  if(!recentFeedback.length){
    fbEl.innerHTML = emptyInline('Todavía no hay comentarios de sesiones completadas.');
  } else {
    fbEl.innerHTML = recentFeedback.map(a=>`
      <div class="list-row">
        <div>
          <strong>${esc(athleteName(a.athleteId))}</strong> — ${esc(a.templateName)}
          <div class="meta">${fmtDate(a.date)}${a.rpe? ' · RPE '+a.rpe : ''}</div>
          <div style="margin-top:6px;">${esc(a.athleteNotes)}</div>
        </div>
      </div>`).join('');
  }
}

function emptyInline(msg){ return `<div class="meta" style="color:var(--chalk-faint);">${msg}</div>`; }

function gaugeSVG(value, max, centerLabel, color){
  const pct = Math.max(0,Math.min(1, value/max));
  const r = 34, c = 2*Math.PI*r;
  const dash = c*pct;
  return `<div class="gauge-wrap">
    <svg width="84" height="84" viewBox="0 0 84 84">
      <circle cx="42" cy="42" r="${r}" fill="none" stroke="var(--line)" stroke-width="7"/>
      <circle cx="42" cy="42" r="${r}" fill="none" stroke="${color}" stroke-width="7"
        stroke-dasharray="${dash} ${c-dash}" stroke-linecap="round"
        transform="rotate(-90 42 42)"/>
      <text x="42" y="47" text-anchor="middle" font-family="Space Grotesk" font-size="15" fill="var(--chalk)">${centerLabel}</text>
    </svg>
  </div>`;
}

/* ==================== CARPETAS (ejercicios y sesiones) ==================== */
// Cada carpeta es {id, name}. Los elementos guardan folderId (null = sin carpeta).
// La lista de carpetas se guarda en app_data con las claves exercise-folders / session-folders.
const FOLDERS = {
  exercises: { foldersKey:'exerciseFolders', itemsKey:'exercises', label:'ejercicio' },
  sessions:  { foldersKey:'sessionFolders',  itemsKey:'sessionTemplates', label:'sesión' }
};
let folderSel = { exercises:'all', sessions:'all' }; // 'all' | 'none' | id de carpeta
function folderOf(kind, item){
  const f = item.folderId && state[FOLDERS[kind].foldersKey].find(x=>x.id===item.folderId);
  return f ? f.id : null;
}
function inSelectedFolder(kind, item){
  const sel = folderSel[kind];
  if(sel==='all') return true;
  if(sel==='none') return !folderOf(kind, item);
  return folderOf(kind, item)===sel;
}
function folderBarHtml(kind){
  const cfg = FOLDERS[kind], folders = state[cfg.foldersKey], items = state[cfg.itemsKey];
  const sel = folderSel[kind];
  const count = id => items.filter(it=>folderOf(kind,it)===id).length;
  const noneCount = count(null);
  const current = folders.find(f=>f.id===sel);
  return `<div class="folder-bar">
    <button type="button" class="folder-chip ${sel==='all'?'selected':''}" data-folder="all">Todas <span>${items.length}</span></button>
    ${folders.map(f=>`<button type="button" class="folder-chip ${sel===f.id?'selected':''}" data-folder="${f.id}">📁 ${esc(f.name)} <span>${count(f.id)}</span></button>`).join('')}
    ${folders.length && noneCount ? `<button type="button" class="folder-chip ${sel==='none'?'selected':''}" data-folder="none">Sin carpeta <span>${noneCount}</span></button>` : ''}
    <button type="button" class="folder-chip folder-new" data-newfolder>+ Nueva carpeta</button>
  </div>
  ${current ? `<div class="folder-actions"><span class="meta">Carpeta «${esc(current.name)}»</span>
    <button type="button" class="btn btn-ghost btn-sm" data-renamefolder>Renombrar</button>
    <button type="button" class="btn btn-ghost btn-sm" data-delfolder>Eliminar carpeta</button></div>` : ''}`;
}
function wireFolderBar(root, kind){
  const cfg = FOLDERS[kind];
  root.querySelectorAll('[data-folder]').forEach(b=>b.addEventListener('click', ()=>{ folderSel[kind] = b.getAttribute('data-folder'); render(); }));
  const nb = root.querySelector('[data-newfolder]');
  if(nb) nb.addEventListener('click', ()=>folderNameModal('Nueva carpeta', '', name=>{
    const f = {id:uid('fld'), name};
    state[cfg.foldersKey].push(f); persist(cfg.foldersKey);
    folderSel[kind] = f.id; render();
  }));
  const current = state[cfg.foldersKey].find(f=>f.id===folderSel[kind]);
  const rb = root.querySelector('[data-renamefolder]');
  if(rb && current) rb.addEventListener('click', ()=>folderNameModal('Renombrar carpeta', current.name, name=>{
    current.name = name; persist(cfg.foldersKey); render();
  }));
  const db = root.querySelector('[data-delfolder]');
  if(db && current) db.addEventListener('click', ()=>{
    const inside = state[cfg.itemsKey].filter(it=>it.folderId===current.id);
    if(!confirm(`¿Eliminar la carpeta «${current.name}»?` + (inside.length ? ` Sus ${inside.length} elemento(s) no se borran: pasan a «Sin carpeta».` : ''))) return;
    inside.forEach(it=>{ it.folderId = null; });
    state[cfg.foldersKey] = state[cfg.foldersKey].filter(f=>f.id!==current.id);
    persist(cfg.foldersKey); if(inside.length) persist(cfg.itemsKey);
    folderSel[kind] = 'all'; render();
  });
}
function folderNameModal(title, initial, onOk){
  openModal(title, `
    <div class="field"><label>Nombre de la carpeta</label><input type="text" id="f_folder_name" value="${esc(initial)}" placeholder="p. ej. Pretemporada, Fuerza, Movilidad..."></div>
    <div class="modal-actions"><button class="btn" id="cancelBtn">Cancelar</button><button class="btn btn-primary" id="saveBtn">Guardar</button></div>
  `, (body)=>{
    const inp = body.querySelector('#f_folder_name'); inp.focus();
    const ok = ()=>{ const name = inp.value.trim(); if(!name){ toast('Ponle un nombre a la carpeta.'); return; } closeModal(); onOk(name); };
    body.querySelector('#cancelBtn').addEventListener('click', closeModal);
    body.querySelector('#saveBtn').addEventListener('click', ok);
    inp.addEventListener('keydown', ev=>{ if(ev.key==='Enter'){ ev.preventDefault(); ok(); } });
  });
}
// Selector de carpeta para los formularios. Por defecto, la carpeta que está abierta.
function folderSelectHtml(kind, currentId){
  const folders = state[FOLDERS[kind].foldersKey];
  if(!folders.length) return '';
  const def = currentId!==undefined ? currentId : (folders.some(f=>f.id===folderSel[kind]) ? folderSel[kind] : null);
  return `<div class="field"><label>Carpeta</label><select id="f_folder">
    <option value="">— Sin carpeta —</option>
    ${folders.map(f=>`<option value="${f.id}" ${def===f.id?'selected':''}>${esc(f.name)}</option>`).join('')}
  </select></div>`;
}
function readFolderSelect(body){ const el = body.querySelector('#f_folder'); return el ? (el.value || null) : undefined; }

// Etiquetas que se usan en la biblioteca, con cuántos ejercicios tiene cada una
function allExerciseTags(){
  const counts = {};
  state.exercises.forEach(e=>(e.categories||[]).forEach(c=>{ counts[c]=(counts[c]||0)+1; }));
  return Object.entries(counts).sort((a,b)=>a[0].localeCompare(b[0],'es'));
}
function renderExerciseList(){
  const list = document.getElementById('exList');
  if(!state.exercises.length){
    list.innerHTML = `<div class="empty"><h3>Biblioteca vacía</h3><p>Añade ejercicios para reutilizarlos al crear sesiones.</p></div>`;
    return;
  }
  const q = exerciseFilterQuery.trim().toLowerCase();
  const filtered = state.exercises.filter(e=>{
    const matchesQ = !q || e.name.toLowerCase().includes(q) || (e.categories||[]).some(c=>c.toLowerCase().includes(q));
    const matchesTags = exerciseFilterTags.every(t=>(e.categories||[]).includes(t));
    return inSelectedFolder('exercises', e) && matchesQ && matchesTags;
  });
  if(!filtered.length){ list.innerHTML = emptyBlock('Ningún ejercicio coincide con ese filtro.'); return; }
  list.innerHTML = filtered.map(e=>{
    const thumb = thumbUrl(e);
    const img = thumb ? `<img class="ex-thumb" src="${thumb}" alt="">` : `<div class="ex-thumb-placeholder">▶</div>`;
    return `
    <div class="list-row">
      <div style="display:flex;gap:10px;align-items:flex-start;">
        ${img}
        <div>
          <strong>${esc(e.name)}</strong>${folderSel.exercises==='all' && folderOf('exercises', e) ? ` <span class="meta">· 📁 ${esc(state.exerciseFolders.find(f=>f.id===e.folderId).name)}</span>` : ''}
          ${(e.categories||[]).length? `<div style="margin-top:4px;">${(e.categories||[]).map(c=>`<span class="badge badge-type" style="margin-right:4px;">${esc(c)}</span>`).join('')}</div>` : ''}
          ${e.videoUrl? `<a class="video-link" href="${esc(normalizeUrl(e.videoUrl))}" target="_blank" rel="noopener noreferrer" style="display:inline-block;margin-top:4px;">▶ ver vídeo</a>` : ''}
          ${e.notes? `<div class="meta" style="margin-top:4px;">${esc(e.notes)}</div>` : ''}
        </div>
      </div>
      <div class="actions">
        <button class="btn btn-sm" data-edit="${e.id}">Editar</button>
        <button class="btn btn-sm btn-danger" data-del="${e.id}">Eliminar</button>
      </div>
    </div>`;
  }).join('');
  list.querySelectorAll('[data-edit]').forEach(b=>b.addEventListener('click', ()=>exerciseForm(b.getAttribute('data-edit'))));
  list.querySelectorAll('[data-del]').forEach(b=>b.addEventListener('click', ()=>{
    state.exercises = state.exercises.filter(e=>e.id!==b.getAttribute('data-del'));
    persist('exercises'); render();
  }));
}
function exerciseForm(id){
  const src = id ? state.exercises.find(x=>x.id===id) : {id:uid('ex'), name:'', categories:[], videoUrl:'', notes:''};
  const e = JSON.parse(JSON.stringify(src));

      <button class="btn btn-primary" id="saveBtn">Guardar</button>
    </div>
  `, (body)=>{
    function renderCatGrid(){
      const grid = body.querySelector('#catGrid');
      const allTags = Array.from(new Set([...TAG_OPTIONS, ...e.categories]));
      grid.innerHTML = allTags.map(t=>`<button type="button" class="tag-chip ${e.categories.includes(t)?'selected':''}" data-tag="${esc(t)}">${esc(t)}</button>`).join('');
      grid.querySelectorAll('[data-tag]').forEach(chip=>{
        chip.addEventListener('click', ()=>{
          const t = chip.getAttribute('data-tag');
          e.categories = e.categories.includes(t) ? e.categories.filter(x=>x!==t) : [...e.categories, t];
          renderCatGrid();
        });
      });
    }
    renderCatGrid();
    body.querySelector('#customTag').addEventListener('keydown', (ev)=>{

      persist('exercises'); closeModal(); render();

  });
}

    function renderBlocksUI(){

      c.innerHTML = s.blocks.map(blk=>`
        <div class="block-editor" data-blockid="${blk.id}">
          <div class="block-editor-head">
            <input type="text" class="block-name-input" placeholder="Nombre del bloque (p. ej. Calentamiento, Bloque A...)" value="${esc(blk.name)}">

          <div style="display:flex;gap:8px;flex-wrap:wrap;">
            <button class="btn btn-sm" type="button" data-addex="${blk.id}">+ Añadir ejercicio</button>

        </div>
      `).join('') || '<p class="meta" style="margin-bottom:10px;">Todavía no has añadido ningún bloque.</p>';
      s.blocks.forEach(blk=>{

      c.querySelectorAll('[data-addex]').forEach(btn=>{

      });
    }
    function newEx(extra){ return Object.assign({id:uid('exx'), exerciseName:'', sets:'', reps:'', load:'', rest:'', videoUrl:'', notes:''}, extra||{}); }
    // Ejercicios marcados con la casilla (para agruparlos o sacarlos de una superserie)
    const selected = new Set();
    function exRowHtml(ex, label){
      return `<div class="ex-row ${selected.has(ex.id)?'is-selected':''}" data-exid="${ex.id}">
          <div class="ex-search-wrap">
            <input type="checkbox" class="ex-select" data-selex="${ex.id}" ${selected.has(ex.id)?'checked':''} title="Marcar para agrupar en superserie" aria-label="Marcar ejercicio">
            ${label ? `<span class="ss-tag">${label}</span>` : ''}
            <input type="text" class="ex-search-input" value="${esc(ex.exerciseName)}" placeholder="Buscar ejercicio…" autocomplete="off">
            <div class="ex-dropdown" hidden></div>
          </div>
          <input type="text" placeholder="series" value="${esc(ex.sets)}" data-f="sets" ${ex.supersetId?'title="Se rellena con las rondas de la superserie; puedes cambiarlo"':''}>
          <input type="text" placeholder="reps" value="${esc(ex.reps)}" data-f="reps">
          <input type="text" placeholder="carga" value="${esc(ex.load)}" data-f="load">
          ${restSelectHtml(ex.rest, 'data-f="rest" aria-label="Descanso"')}
          <input type="text" placeholder="enlace vídeo" value="${esc(ex.videoUrl)}" data-f="videoUrl">
          <input type="text" placeholder="notas" value="${esc(ex.notes)}" data-f="notes">
          <div class="ex-row-actions">
            <button class="btn btn-ghost btn-sm" type="button" data-rmex="${ex.id}" title="Eliminar ejercicio">✕</button>
          </div>
        </div>`;
    }
    function selBarHtml(blk){
      const sel = blk.exercises.filter(e=>selected.has(e.id));
      if(!sel.length) return `<p class="sel-hint">Consejo: marca la casilla de 2 o más ejercicios para agruparlos en una superserie.</p>`;
      const inSS = sel.filter(e=>e.supersetId);
      const ssIds = [...new Set(inSS.map(e=>e.supersetId))];
      const segs = blockSegments(blk);
      const letterOf = id=>{ const g = segs.find(x=>x.ss && x.ss.id===id); return g ? g.letter : ''; };
      const joinLabel = ssIds.length===1 && inSS.length<sel.length ? `⛓ Añadir a la superserie ${letterOf(ssIds[0])}`
        : ssIds.length>1 ? '⛓ Juntar en una superserie' : '⛓ Crear superserie';
      const canJoin = sel.length>=2 && !(ssIds.length===1 && inSS.length===sel.length);
      return `<div class="sel-bar">
        <span>${sel.length} marcado${sel.length>1?'s':''}</span>
        ${canJoin ? `<button class="btn btn-primary btn-sm" type="button" data-seljoin>${joinLabel}</button>` : ''}
        ${inSS.length ? `<button class="btn btn-sm" type="button" data-selout>⇱ Sacar de la superserie</button>` : ''}
        <button class="btn btn-ghost btn-sm" type="button" data-selclear>Cancelar</button>
      </div>`;
    }
    function renderExRows(wrap, blk){
      normalizeSupersets(blk);
      const exs = blk.exercises;
      wrap.innerHTML = blockSegments(blk).map(seg=>{
        if(seg.single) return exRowHtml(seg.single, '');
        return `<div class="ss-box" data-ssid="${seg.ss.id}">
          <div class="ss-head">
            <strong>Superserie ${seg.letter}</strong>
            <label>Rondas <input type="number" min="1" class="ss-rounds" value="${esc(seg.ss.rounds)}"></label>
            <label>Descanso entre rondas ${restSelectHtml(seg.ss.rest, 'class="ss-rest"')}</label>
            <button class="btn btn-ghost btn-sm" type="button" data-unss="${seg.ss.id}">Deshacer superserie</button>
          </div>
          ${seg.exs.map((ex,i)=>exRowHtml(ex, seg.letter+(i+1))).join('')}
          <button class="btn btn-sm" type="button" data-addtoss="${seg.ss.id}">+ Ejercicio a la superserie</button>
        </div>`;
      }).join('') || '<p class="meta" style="font-size:12px;margin-bottom:8px;">Sin ejercicios en este bloque todavía.</p>';
      wrap.insertAdjacentHTML('beforeend', `<div class="sel-wrap">${exs.length>=2 ? selBarHtml(blk) : ''}</div>`);
      // Superseries: rondas (rellenan las series de cada ejercicio), descanso, deshacer, añadir
      (blk.supersets||[]).forEach(ss=>{
        const box = wrap.querySelector(`[data-ssid="${ss.id}"]`); if(!box) return;
        box.querySelector('.ss-rounds').addEventListener('input', ev=>{
          ss.rounds = ev.target.value;
          // Al cambiar las rondas, todas las series de la superserie se ponen igual
          exs.filter(e=>e.supersetId===ss.id).forEach(e=>{
            delete e.setsCustom; e.sets = String(ss.rounds);
            const inp = box.querySelector(`[data-exid="${e.id}"] [data-f="sets"]`); if(inp) inp.value = e.sets;
          });
        });
        box.querySelector('.ss-rest').addEventListener('change', ev=>{ ss.rest = ev.target.value; });
        box.querySelector('[data-unss]').addEventListener('click', ()=>{
          exs.filter(e=>e.supersetId===ss.id).forEach(leaveSuperset);
          renderExRows(wrap, blk);
        });
        box.querySelector('[data-addtoss]').addEventListener('click', ()=>{
          const lastIdx = exs.map(e=>e.supersetId).lastIndexOf(ss.id);
          exs.splice(lastIdx+1, 0, newEx({supersetId:ss.id}));
          renderExRows(wrap, blk);
        });
      });
      // Marcar ejercicios y acciones sobre los marcados
      wrap.querySelectorAll('[data-selex]').forEach(cb=>cb.addEventListener('change', ()=>{
        const id = cb.getAttribute('data-selex');
        if(cb.checked) selected.add(id); else selected.delete(id);
        cb.closest('.ex-row').classList.toggle('is-selected', cb.checked);
        const sw = wrap.querySelector('.sel-wrap'); sw.innerHTML = selBarHtml(blk); wireSelBar();
      }));
      function wireSelBar(){
        const sel = ()=>exs.filter(e=>selected.has(e.id));
        const done = ()=>{ exs.forEach(e=>selected.delete(e.id)); renderExRows(wrap, blk); };
        const j = wrap.querySelector('[data-seljoin]');
        if(j) j.addEventListener('click', ()=>{
          const list = sel();
          // Si alguno ya está en una superserie, los demás se suman a esa; si no, se crea una nueva
          let target = (list.find(e=>e.supersetId)||{}).supersetId;
          if(!target){
            const ss = {id:uid('ss'), rounds: parseInt(list[0].sets,10) || 3, rest:''};
            blk.supersets = [...(blk.supersets||[]), ss]; target = ss.id;
          }
          list.forEach(e=>{
            if(e.supersetId===target) return;
            if(e.supersetId){ e.supersetId = target; delete e.setsCustom; } else joinSuperset(e, target);
          });
          // Los recién añadidos se colocan tras el último ejercicio de la superserie
          const members = exs.filter(e=>e.supersetId===target);
          const first = exs.indexOf(members[0]);
          const rest = exs.filter(e=>e.supersetId!==target);
          rest.splice(Math.min(first, rest.length), 0, ...members);
          blk.exercises = rest;
          done();
        });
        const o = wrap.querySelector('[data-selout]');
        if(o) o.addEventListener('click', ()=>{
          sel().filter(e=>e.supersetId).forEach(ex=>{
            const sid = ex.supersetId; leaveSuperset(ex);
            const arr = blk.exercises;
            arr.splice(arr.indexOf(ex),1);
            const lastIdx = arr.map(e=>e.supersetId).lastIndexOf(sid);
            arr.splice(lastIdx>=0 ? lastIdx+1 : arr.length, 0, ex);
          });
          done();
        });
        const c = wrap.querySelector('[data-selclear]');
        if(c) c.addEventListener('click', done);
      }
      wireSelBar();
      blk.exercises.forEach(ex=>{
        const row = wrap.querySelector(`[data-exid="${ex.id}"]`);
        if(!row) return;
        row.querySelectorAll('[data-f]').forEach(inp=>{
          inp.addEventListener(inp.tagName==='SELECT' ? 'change' : 'input', ()=>{
            const f = inp.getAttribute('data-f');
            ex[f] = inp.value;
            // Series cambiadas a mano dentro de una superserie: se respetan hasta que vuelvas a cambiar las rondas
            if(f==='sets' && ex.supersetId){
              const ss = (blk.supersets||[]).find(x=>x.id===ex.supersetId);
              if(ss && String(ss.rounds)!==inp.value) ex.setsCustom = true; else delete ex.setsCustom;
            }
          });
        });
        row.querySelector('[data-rmex]').addEventListener('click', ()=>{
          blk.exercises.splice(blk.exercises.indexOf(ex), 1);
          selected.delete(ex.id);
          renderExRows(wrap, blk);
        });
        wireExerciseSearch(row, ex);
      });
    }
    function wireExerciseSearch(row, ex){
      const input = row.querySelector('.ex-search-input');
      const dd = row.querySelector('.ex-dropdown');
      function showResults(q){
        const query = q.trim().toLowerCase();
        const matches = !query
          ? state.exercises.slice(0,8)
          : state.exercises.filter(libEx =>
              libEx.name.toLowerCase().includes(query) ||
              (libEx.categories||[]).some(c=>c.toLowerCase().includes(query))
            ).slice(0,8);
        if(!matches.length){
          dd.innerHTML = '<div class="ex-dropdown-item" style="cursor:default;">Sin coincidencias en tu biblioteca</div>';
          dd.hidden = false; return;
        }
        dd.innerHTML = matches.map(libEx=>{
          const thumb = thumbUrl(libEx);
          const img = thumb ? `<img class="ex-thumb" src="${thumb}" alt="">` : `<div class="ex-thumb-placeholder">▶</div>`;
          const tags = (libEx.categories||[]).slice(0,3).join(' · ');
          return `<div class="ex-dropdown-item" data-pick="${libEx.id}">
            ${img}
            <div><div class="ex-dd-name">${esc(libEx.name)}</div>${tags?`<div class="ex-dd-tags">${esc(tags)}</div>`:''}</div>
          </div>`;
        }).join('');
        dd.hidden = false;
        dd.querySelectorAll('[data-pick]').forEach(item=>{
          item.addEventListener('mousedown', (ev)=>{
            ev.preventDefault();
            const libEx = state.exercises.find(x=>x.id===item.getAttribute('data-pick'));
            ex.exerciseName = libEx.name;
            input.value = libEx.name;
            if(libEx.videoUrl && !ex.videoUrl){
              ex.videoUrl = libEx.videoUrl;
              const videoInput = row.querySelector('[data-f="videoUrl"]');
              if(videoInput) videoInput.value = libEx.videoUrl;
            }
            dd.hidden = true;
          });
        });
      }
      input.addEventListener('input', ()=>{ ex.exerciseName = input.value; showResults(input.value); });
      input.addEventListener('focus', ()=>{ showResults(input.value); });
      input.addEventListener('blur', ()=>{ setTimeout(()=>{ dd.hidden = true; }, 150); });
    }
    renderBlocksUI();
    body.querySelector('#addBlockBtn').addEventListener('click', ()=>{
      s.blocks.push({id:uid('blk'), name:'', exercises:[]});
      renderBlocksUI();
    });
    body.querySelector('#cancelBtn').addEventListener('click', closeModal);
    const saveBtn = body.querySelector('#saveBtn');
    saveBtn.addEventListener('click', async ()=>{
      const name = body.querySelector('#f_name').value.trim();
      if(!name){ toast('Ponle un nombre a la sesión.'); return; }
      if(opts.mustDifferFrom && name.toLowerCase()===opts.mustDifferFrom.toLowerCase()){ toast('Ponle un nombre distinto al de la sesión original.'); return; }
      s.name=name; s.focus=body.querySelector('#f_focus').value.trim(); s.notes=body.querySelector('#f_notes').value.trim();
      s.blocks.forEach(normalizeSupersets);
      const fld = readFolderSelect(body); if(fld!==undefined) s.folderId = fld;
      if(opts.onSave){
        saveBtn.disabled = true;
        const ok = await opts.onSave(s, body);
        saveBtn.disabled = false;
        if(ok!==false) closeModal();
        return;
      }
      const idx = state.sessionTemplates.findIndex(x=>x.id===s.id);
      if(idx>=0) state.sessionTemplates[idx]=s; else state.sessionTemplates.push(s);
      persist('sessionTemplates');
      closeModal();
      if(onSaved) onSaved(s); else render();
    });
  });
}

/* ==================== COACH: QUESTIONNAIRE TEMPLATES ==================== */
function renderQTemplates(main){
  main.innerHTML = `
    <div class="section-head">
      <div><h2>Cuestionarios</h2><div class="sub">Wellness, RPE u otros que tus deportistas puedan responder</div></div>
      <button class="btn btn-primary" id="addQBtn">+ Nuevo cuestionario</button>
    </div>
    <div id="qList"></div>
  `;
  document.getElementById('addQBtn').addEventListener('click', ()=>qForm());
  const list = document.getElementById('qList');
  if(!state.qTemplates.length){
    list.innerHTML = `<div class="empty"><h3>Sin cuestionarios</h3><p>Crea uno de wellness o RPE para poder programarlo a tus deportistas.</p></div>`;
    return;
  }
  list.innerHTML = state.qTemplates.map(q=>`
    <div class="list-row">
      <div>
        <strong>${esc(q.name)}</strong> <span class="badge badge-type">${esc(q.type)}</span>
        <div class="meta">${q.questions.length} pregunta(s)</div>
      </div>
      <div class="actions">
        <button class="btn btn-sm" data-edit="${q.id}">Editar</button>
        <button class="btn btn-sm btn-danger" data-del="${q.id}">Eliminar</button>
      </div>
    </div>`).join('');
  list.querySelectorAll('[data-edit]').forEach(b=>b.addEventListener('click', ()=>qForm(b.getAttribute('data-edit'))));
  list.querySelectorAll('[data-del]').forEach(b=>b.addEventListener('click', ()=>{
    state.qTemplates = state.qTemplates.filter(q=>q.id!==b.getAttribute('data-del'));
    persist('qTemplates'); render();
  }));
}
function qForm(id){
  const q = id ? JSON.parse(JSON.stringify(state.qTemplates.find(x=>x.id===id))) : {id:uid('q'), name:'', type:'personalizado', questions:[]};
  const bodyHtml = `
    <div class="field"><label>Nombre del cuestionario</label><input type="text" id="f_name" value="${esc(q.name)}"></div>
    <div class="field"><label>Tipo</label>
      <select id="f_type">
        ${['wellness','rpe','personalizado'].map(t=>`<option value="${t}" ${q.type===t?'selected':''}>${t}</option>`).join('')}
      </select>
    </div>
    <label>Preguntas</label>
    <div id="qList2"></div>
    <button class="btn btn-sm" id="addQItemBtn" type="button">+ Añadir pregunta</button>
    <div class="modal-actions">
      <button class="btn" id="cancelBtn">Cancelar</button>
      <button class="btn btn-primary" id="saveBtn">Guardar cuestionario</button>
    </div>
  `;
  openModal(id?'Editar cuestionario':'Nuevo cuestionario', bodyHtml, (body)=>{
    function renderQItems(){
      const c = body.querySelector('#qList2');
      c.innerHTML = q.questions.map(item=>`
        <fieldset data-q="${item.id}">
          <div class="field"><label>Pregunta</label><input type="text" value="${esc(item.text)}" data-f="text"></div>
          <div class="row">
            <div class="field"><label>Tipo de respuesta</label>
              <select data-f="type">
                <option value="escala" ${item.type==='escala'?'selected':''}>Escala numérica</option>
                <option value="numero" ${item.type==='numero'?'selected':''}>Número libre</option>
                <option value="texto" ${item.type==='texto'?'selected':''}>Texto</option>
              </select>
            </div>
            <div class="field min-max" style="${item.type==='escala'?'':'display:none;'}"><label>Mín / Máx</label>
              <div class="row"><input type="number" value="${item.min??1}" data-f="min"><input type="number" value="${item.max??5}" data-f="max"></div>
            </div>
          </div>
          <button class="btn btn-ghost btn-sm" type="button" data-rmq="${item.id}">Eliminar pregunta</button>
        </fieldset>`).join('');
      c.querySelectorAll('[data-q]').forEach(fs=>{
        const qid = fs.getAttribute('data-q');
        const item = q.questions.find(x=>x.id===qid);
        fs.querySelectorAll('[data-f]').forEach(inp=>{
          inp.addEventListener('input', ()=>{
            const f = inp.getAttribute('data-f');
            item[f] = inp.type==='number' ? Number(inp.value) : inp.value;
            if(f==='type'){ fs.querySelector('.min-max').style.display = inp.value==='escala' ? '' : 'none'; }
          });
        });
      });
      c.querySelectorAll('[data-rmq]').forEach(btn=>{
        btn.addEventListener('click', ()=>{
          q.questions = q.questions.filter(x=>x.id!==btn.getAttribute('data-rmq'));
          renderQItems();
        });
      });
    }
    renderQItems();
    body.querySelector('#addQItemBtn').addEventListener('click', ()=>{
      q.questions.push({id:uid('qq'), text:'', type:'escala', min:1, max:5});
      renderQItems();
    });
    body.querySelector('#cancelBtn').addEventListener('click', closeModal);
    body.querySelector('#saveBtn').addEventListener('click', ()=>{
      const name = body.querySelector('#f_name').value.trim();
      if(!name){ toast('Ponle un nombre al cuestionario.'); return; }
      q.name=name; q.type=body.querySelector('#f_type').value;
      const idx = state.qTemplates.findIndex(x=>x.id===q.id);
      if(idx>=0) state.qTemplates[idx]=q; else state.qTemplates.push(q);
      persist('qTemplates'); closeModal(); render();
    });
  });
}

/* ==================== COACH: CALENDAR ==================== */
const MONTHS_ES = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
function calendarItems(d){
  const f = a=> a.date===d && (calendarAthleteFilter==='all'||a.athleteId===calendarAthleteFilter);
  return [
    ...state.assignments.filter(f).map(a=>({...a,_kind:'sesión'})),
    ...state.qAssignments.filter(f).map(a=>({...a,_kind:'cuestionario'}))
  ];
}
function openCalendarItem(kind, id){
  if(kind==='sesión') viewSessionAssignment(id, true); else viewQAssignment(id, true);
}
function renderCalendar(main){
  const today = todayISO();
  const isWeek = calendarView==='week';
  let title, days, monthKey;
  if(isWeek){
    const monday = addDays(startOfWeek(today), weekOffset*7);
    days = [0,1,2,3,4,5,6].map(i=>addDays(monday,i));
    title = `${fmtDate(monday)} – ${fmtDate(addDays(monday,6))}`;
  } else {
    const now = new Date();
    const first = new Date(now.getFullYear(), now.getMonth()+monthOffset, 1);
    const last = new Date(first.getFullYear(), first.getMonth()+1, 0);
    const gridStart = startOfWeek(localISO(first));
    const gridEnd = addDays(startOfWeek(localISO(last)), 6);
    days = [];
    for(let d=gridStart; d<=gridEnd; d=addDays(d,1)) days.push(d);
    title = `${MONTHS_ES[first.getMonth()]} ${first.getFullYear()}`;
    monthKey = localISO(first).slice(0,7);
  }
  main.innerHTML = `
    <div class="section-head">
      <div><h2>Planificación</h2><div class="sub">Programa sesiones y cuestionarios para tu comunidad</div></div>
      <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;">
        <select id="filterAthlete">
          <option value="all">Todos los deportistas</option>
          ${state.athletes.map(a=>`<option value="${a.id}" ${calendarAthleteFilter===a.id?'selected':''}>${esc(a.name)}</option>`).join('')}
        </select>
        <button class="btn btn-primary" id="assignBtn">+ Asignar</button>
      </div>
    </div>
    <div class="cal-toolbar">
      <div class="seg">
        <button class="seg-btn ${isWeek?'active':''}" data-calview="week">Semana</button>
        <button class="seg-btn ${!isWeek?'active':''}" data-calview="month">Mes</button>
      </div>
      <div class="cal-nav">
        <button class="btn btn-sm" id="calPrev" aria-label="Anterior">‹</button>
        <button class="btn btn-sm" id="calToday">Hoy</button>
        <button class="btn btn-sm" id="calNext" aria-label="Siguiente">›</button>
        <span class="cal-title">${title}</span>
      </div>
    </div>
    <div id="calGrid"></div>
    <div id="detailArea" style="margin-top:22px;"></div>
  `;
  document.getElementById('filterAthlete').value = calendarAthleteFilter;
  document.getElementById('filterAthlete').addEventListener('change', (e)=>{ calendarAthleteFilter=e.target.value; render(); });
  main.querySelectorAll('[data-calview]').forEach(b=>b.addEventListener('click', ()=>{
    calendarView = b.getAttribute('data-calview'); weekOffset = 0; monthOffset = 0; render();
  }));
  document.getElementById('calPrev').addEventListener('click', ()=>{ if(isWeek) weekOffset--; else monthOffset--; render(); });
  document.getElementById('calNext').addEventListener('click', ()=>{ if(isWeek) weekOffset++; else monthOffset++; render(); });
  document.getElementById('calToday').addEventListener('click', ()=>{ weekOffset = 0; monthOffset = 0; render(); });
  document.getElementById('assignBtn').addEventListener('click', ()=>assignForm(defaultAssignPrefill()));

  const grid = document.getElementById('calGrid');
  if(isWeek){
    grid.className = 'week-grid';
    grid.innerHTML = days.map(d=>{
      const items = calendarItems(d);
      return `<div class="day-col ${d===today?'is-today':''}">
        <div class="day-head-row">
          <div class="day-head ${d===today?'today':''}">${fmtDate(d)}</div>
          <button class="day-add" data-addday="${d}" title="Añadir" aria-label="Añadir el ${fmtDate(d)}">+</button>
        </div>
        ${items.map(it=>`<div class="day-item ${it._kind==='cuestionario'?'is-q':''}" data-kind="${it._kind}" data-id="${it.id}">
          <span class="t">${esc(it.templateName)}</span>
          ${esc(athleteName(it.athleteId))} · ${it.status==='completada'?'✓':'pendiente'}
        </div>`).join('') || '<div class="meta" style="font-size:11px;">—</div>'}
      </div>`;
    }).join('');
    grid.querySelectorAll('[data-addday]').forEach(b=>b.addEventListener('click', ()=>dayMenu(b.getAttribute('data-addday'))));
  } else {
    grid.className = 'month-grid';
    const MAX = 3;
    grid.innerHTML = ['L','M','X','J','V','S','D'].map(w=>`<div class="month-dow">${w}</div>`).join('') +
      days.map(d=>{
        const items = calendarItems(d);
        const out = d.slice(0,7)!==monthKey;
        return `<div class="month-cell ${out?'out':''} ${d===today?'is-today':''}" data-day="${d}">
          <div class="month-num">${Number(d.slice(8))}</div>
          ${items.slice(0,MAX).map(it=>`<div class="month-chip ${it._kind==='cuestionario'?'is-q':''} ${it.status==='completada'?'done':''}" data-kind="${it._kind}" data-id="${it.id}" title="${esc(it.templateName)} · ${esc(athleteName(it.athleteId))}">${esc(it.templateName)}</div>`).join('')}
          ${items.length>MAX?`<div class="month-more">+${items.length-MAX} más</div>`:''}
        </div>`;
      }).join('');
    grid.querySelectorAll('[data-day]').forEach(c=>c.addEventListener('click', ()=>dayMenu(c.getAttribute('data-day'))));
  }
  grid.querySelectorAll('[data-id]').forEach(el=>{
    el.addEventListener('click', (e)=>{
      e.stopPropagation();
      openCalendarItem(el.getAttribute('data-kind'), el.getAttribute('data-id'));
    });
  });
}
// Quitar una sesión o cuestionario de un día (se borra solo esa asignación, no la plantilla)
async function removeAssignment(kind, id){
  const list = kind==='sesión' ? state.assignments : state.qAssignments;
  const a = list.find(x=>x.id===id); if(!a) return;
  let msg = `¿Quitar «${a.templateName}» del ${fmtDate(a.date)} de ${athleteName(a.athleteId)}?`;
  if(a.status==='completada') msg += `\n\nOjo: ya está completada; se borrarán también ${kind==='sesión'?'su RPE y comentarios':'sus respuestas'}.`;
  if(!confirm(msg)) return;
  const ok = await deleteItem(id);
  if(!ok){ toast('No se ha podido quitar. Revisa tu conexión e inténtalo de nuevo.'); return; }
  if(kind==='sesión') state.assignments = state.assignments.filter(x=>x.id!==id);
  else state.qAssignments = state.qAssignments.filter(x=>x.id!==id);
  toast('Quitado del día.');
  closeModal(); render();
}
// Modificar la sesión asignada a un día concreto (y, si se quiere, también la plantilla)
function editAssignedSession(id){
  const a = state.assignments.find(x=>x.id===id); if(!a) return;
  a.blocks = migrateBlocks(a.blocks);
  const tpl = state.sessionTemplates.find(t=>t.id===a.templateId);
  const extraHtml = tpl ? `<label class="check-row" style="margin-top:6px;"><input type="checkbox" id="f_applyTpl" checked>
      Aplicar también estos cambios a la sesión «${esc(tpl.name)}» de la pestaña Sesiones</label>
      <p class="meta" style="font-size:11.5px;margin:4px 0 0 0;">Lo ya asignado en otros días no cambia.</p>` : '';
  sessionForm(null, null, {
    data: { id:a.id, name:a.templateName, focus:a.focus||'', notes: a.notes ?? (tpl ? tpl.notes||'' : ''), blocks:a.blocks },
    title: `Editar sesión · ${fmtDate(a.date)} · ${athleteName(a.athleteId)}`,
    saveLabel: 'Guardar cambios', hideFolder: true, extraHtml,
    onSave: async (edited, body)=>{
      const applyTpl = !!(tpl && body.querySelector('#f_applyTpl') && body.querySelector('#f_applyTpl').checked);
      const prev = JSON.parse(JSON.stringify(a));
      // Mantener lo que el deportista ya había marcado como hecho
      const doneById = {};
      prev.blocks.forEach(b=>(b.exercises||[]).forEach(x=>{ doneById[x.id] = !!x.done; }));
      a.templateName = edited.name; a.focus = edited.focus; a.notes = edited.notes;
      a.blocks = edited.blocks.map(b=>({ ...b, exercises:(b.exercises||[]).map(x=>({ ...x, done: doneById[x.id]||false })) }));
      const ok = await updateItem(a);
      if(!ok){
        Object.keys(a).forEach(k=>delete a[k]); Object.assign(a, prev);
        toast('No se han podido guardar los cambios. Revisa tu conexión e inténtalo de nuevo.');
        return false;
      }
      if(applyTpl){
        tpl.name = edited.name; tpl.focus = edited.focus; tpl.notes = edited.notes;
        tpl.blocks = edited.blocks.map(b=>({ ...b, exercises:(b.exercises||[]).map(x=>{ const c = {...x}; delete c.done; return c; }) }));
        persist('sessionTemplates');
      }
      toast(applyTpl ? 'Sesión del día y plantilla actualizadas.' : 'Sesión del día actualizada.');
      render();
    }
  });
}
function coachItemActions(kind, id){
  return `<div class="item-actions">
    ${kind==='sesión' ? `<button type="button" class="btn btn-sm" data-editasg="${id}">✎ Editar</button>` : ''}
    <button type="button" class="btn btn-sm btn-danger" data-rmasg="${id}" data-rmkind="${kind}">Quitar</button>
  </div>`;
}
function wireCoachItemActions(root){
  root.querySelectorAll('[data-editasg]').forEach(b=>b.addEventListener('click', (e)=>{ e.stopPropagation(); closeModal(); editAssignedSession(b.getAttribute('data-editasg')); }));
  root.querySelectorAll('[data-rmasg]').forEach(b=>b.addEventListener('click', (e)=>{ e.stopPropagation(); removeAssignment(b.getAttribute('data-rmkind'), b.getAttribute('data-rmasg')); }));
}
function defaultAssignPrefill(extra){
  return Object.assign({ athIds: calendarAthleteFilter!=='all' ? [calendarAthleteFilter] : [] }, extra||{});
}
// Al pulsar un día: ver lo que hay y elegir "Añadir sesión" o "Añadir cuestionario"
